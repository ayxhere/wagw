name: Build wagw

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Tidy
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Build (linux/amd64, compile check)
        run: go build -o wagw-linux .
      - name: Build (android/arm64)
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -o wagw-android-arm64 .
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: wagw-binaries
          path: |
            wagw-linux
            wagw-android-arm64
